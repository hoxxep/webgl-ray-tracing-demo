<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>WebGL Ray Tracer Demo - Liam Gray</title>
</head>
<body>
<div id="page">
    <div class="app-grid">
        <!-- canvas image -->
        <div>
            <div id="screen">
                <div class="loading overlay active">
                    <span class="loader-text">Loading...</span>
                </div>
                <div class="error overlay">
                    <div>
                        <h3>Error</h3>
                        <p>Your browser does not support WebGL.</p>
                    </div>
                </div>
                <a class="ribbon-label" href="https://github.com/hoxxep/webgl-ray-tracing-demo"><i data-lucide="github"></i> WebGL Ray Tracing Demo</a>
                <canvas class="render"></canvas>
            </div>
        </div>

        <!-- controls column -->
        <div id="controls">
            <h2>WebGL Ray Tracing</h2>
            <br>
            <div class="slider-group">
                <strong>Spheres:</strong> <span class="value"></span>
                <input class="spheres setting" type="range" min="1" max="64" step="1" value="27">
            </div>
            <div class="slider-group">
                <strong>Reflection Depth:</strong> <span class="value"></span>
                <input class="reflections setting" type="range" min="0" max="10" step="1" value="2">
            </div>
            <div class="slider-group">
                <strong>Zoom Depth:</strong> <span class="value"></span>
                <input class="zoom setting" type="range" min="1" max="10" step="1" value="5">
            </div>
            <div class="checkbox-group shadows">
                <label>
                    <input type="checkbox">
                    <strong>Shadows</strong>
                </label>
            </div>

            <br>

            <button class="render"><i data-lucide="play"></i> Render</button>

            <span class="render-time"></span>
        </div>
    </div>
    <div class="footer">
        <p class="copyright">
            Copyright &copy; 2016 - Liam Gray
        </p>
    </div>
</div>

<script type="module" src="/src/main.ts"></script>
</body>
</html>
